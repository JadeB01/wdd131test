<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">

        <img src="images/snortleblat.webp" alt="Snortleblat" class="image">

        <div class="name">
            Snortleblat
        </div>

        <div class="stats">
            <p>Class: <span>Swamp Beast Diplomat</span></p>
            <p>Level: <span id="level">8</span></p>
            <p>Health: <span id="health">100</span></p>
        </div>

        <div class="buttons">
            <button id="attackBtn">Attack</button>
            <button id="levelBtn">Level Up</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
