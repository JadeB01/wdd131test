<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <title>RecipeBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="images/recipe-book.png" alt="RecipeBook logo">
        <h1>RecipeBook</h1>
    </header>

    <section class="search-bar">
        <input type="text" placeholder="Find a recipe">
        <button>
            <img src="images/search.svg" alt="Search">
        </button>
    </section>

    <hr>

    <main>
        <article class="recipe-card">

            <div class="recipe-image">
                <img src="images/apple-crisp.jpg" alt="Apple Crisp">
            </div>

            <div class="recipe-info">

                <span class="tag">dessert</span>

                <h2>Apple Crisp</h2>

                <span
                    class="rating"
                    role="img"
                    aria-label="Rating: 4 out of 5 stars"
                >
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>

                <p>
                    This apple crisp recipe is a simple yet delicious fall dessert that's
                    great served warm with vanilla ice cream.
                </p>

            </div>

        </article>
    </main>

    <footer>

        <div class="social">
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>

        <a href="https://www.flaticon.com/free-icons/recipe"
           title="recipe icons">
           Recipe icons created by Freepik - Flaticon
        </a>

    </footer>

</body>
</html>
